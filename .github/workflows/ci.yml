name: CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          run_tests=false
          while IFS= read -r path; do
            case "$path" in
              *.md|*.pdf|*.typ|*.tex|*.latex|*.ltx) ;;
              *) run_tests=true; break ;;
            esac
          done <<< "$changed_files"
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_tests != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # LightGBM's wheel links against OpenMP at import time; without libomp
      # even `import lightgbm` fails, so install it before touching the deps.
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: python -m pytest tests/ -q
